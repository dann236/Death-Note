<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Note | Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="death-page">
    <div class="death-container">
        <p class="section-label">
            THE NAME HAS BEEN WRITTEN
        </p>
        <div class="skull">
            ☠
        </div>
        <h1 id="deadName">
            Unknown
        </h1>
        <p class="death-message">
            40 seconds have passed.
        </p>
        <div class="death-note-info">
            <h2>DEATH NOTE</h2>
            <p>
                The name written in this notebook
                has reached its end.
            </p>
            <p>
                According to the rules of the Death Note,
                the fate of the person depends on what
                has been written in the notebook.
            </p>
        </div>
        <a href="index.html">
            <button>
                WRITE ANOTHER NAME
            </button>
        </a>
    </div>
    <script src="script.js"></script>
</body>
</html>
